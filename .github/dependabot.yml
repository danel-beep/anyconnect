# Weekly dependency updates. Minor/patch updates of the same ecosystem are grouped into one PR
# so CI runs once; major versions arrive as separate PRs to review on their own. A new version is
# offered only after it has been public for a week (`cooldown`): most poisoned releases are found
# and pulled within days. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
