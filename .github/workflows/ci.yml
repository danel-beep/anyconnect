name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manyplug_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/manyplug_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "Run 'npm run db:generate' and commit the migration" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (git status -- drizzle && echo "Uncommitted migration generated" && exit 1)

  # Every page in a real browser (light/dark, desktop/phone, EN/RU): nothing wider than the screen,
  # no text glued to a card's edge, nothing sticking out of its card. See test/visual/.
  visual:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manyplug_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/manyplug_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - name: Screenshots of the pages that failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-failures
          path: visual-failures
          if-no-files-found: ignore
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manyplug
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: manyplug:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image only has production dependencies: start it for real so a runtime import that
      # lives in devDependencies fails here, not on the first deploy.
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name hub --network host \
            -e NODE_ENV=production -e PORT=3000 -e PUBLIC_URL=http://localhost:3000 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/manyplug \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            manyplug:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then docker rm -f hub >/dev/null; exit 0; fi
            sleep 2
          done
          docker logs hub
          exit 1
