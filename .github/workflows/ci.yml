name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manyplug_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/manyplug_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate --name ci-check
          git diff --exit-code -- drizzle || (echo "Run 'npm run db:generate' and commit the migration" && exit 1)
          test -z "$(git status --porcelain -- drizzle)" || (git status -- drizzle && echo "Uncommitted migration generated" && exit 1)

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manyplug
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: manyplug:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image only has production dependencies: start it for real so a runtime import that
      # lives in devDependencies fails here, not on the first deploy.
      - name: Image starts and answers /healthz
        run: |
          docker run -d --name hub --network host \
            -e NODE_ENV=production -e PORT=3000 -e PUBLIC_URL=http://localhost:3000 \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/manyplug \
            -e ENCRYPTION_KEY="$(openssl rand -base64 32)" \
            manyplug:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then docker rm -f hub >/dev/null; exit 0; fi
            sleep 2
          done
          docker logs hub
          exit 1
