name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose --config /repo/.gitleaks.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Registry signatures and provenance
        run: npm audit signatures
