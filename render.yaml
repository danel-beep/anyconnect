# Render Blueprint — one click deploy of the hub + Postgres.
# https://render.com/docs/blueprint-spec
#
# After the first deploy:
#   1. Set ADMIN_EMAIL and ADMIN_PASSWORD in the service's Environment tab (you are asked on creation).
#   2. Back up ENCRYPTION_KEY somewhere safe: without it stored credentials cannot be decrypted.
#   3. For "Sign in with Google" set LOGIN_GOOGLE_CLIENT_ID / LOGIN_GOOGLE_CLIENT_SECRET (redirect URI
#      <your URL>/auth/google/callback) and SUPPORT_EMAIL. See .env.example for the rest.
#
# Service and database names keep the former product name (AnyConnect): renaming them in the
# Blueprint would create new resources instead of renaming the existing ones.
services:
  - type: web
    name: anyconnect
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Always-on instance: the free plan sleeps after 15 minutes, which breaks AI connectors and
    # background work. Starter is the smallest always-on plan.
    plan: starter
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: anyconnect-db
          property: connectionString
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: LOGIN_GOOGLE_CLIENT_ID
        sync: false
      - key: LOGIN_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
      - key: SIGNUPS
        value: open
      # Optional: also send errors to Sentry (docs/OPERATIONS.md)
      - key: SENTRY_DSN
        sync: false
      # AI app directories (docs/DIRECTORIES.md)
      - key: CLIENT_POLICIES
        value: claude
      - key: REVIEW_ACCOUNT_EMAIL
        sync: false
      - key: REVIEW_ACCOUNT_PASSWORD
        sync: false
      - key: WELL_KNOWN_MCP_REGISTRY_AUTH
        sync: false
      # Optional: daily encrypted database backups to an S3-compatible bucket (docs/OPERATIONS.md)
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: anyconnect-db
    plan: basic-256mb
    region: frankfurt
    databaseName: anyconnect
    user: anyconnect
    postgresMajorVersion: "17"
    # Reachable only from services in the same Render account (no public access).
    ipAllowList: []
